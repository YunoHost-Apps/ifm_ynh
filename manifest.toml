#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "ifm"
name = "IFM"
description.en = "Improved File Manager"
description.fr = "Gestionnaire de fichiers amélioré"

version = "4.2.1~ynh1"

maintainers = []

[upstream]
license = "MIT"
demo = "https://ifmdemo.gitea.de/"
code = "https://github.com/misterunknown/ifm"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/ifm"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    in_subdir = false
    extract = false
    url = "https://github.com/misterunknown/ifm/releases/download/v4.2.1/ifm.php"
    sha256 = "6684cf90c98d260f8e81a5a323735e9bc21fc151e9bf8f3362f02e9f97be3721"
    rename = "ifm.php"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "ifm.php"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.show_tile = false
    api.allowed = "visitors"
    api.auth_header = false

    [resources.apt]
    packages = "php8.5-zip, php8.5-bz2, php8.5-gd, php8.5-curl, php8.5-mbstring, php8.5-ldap, php8.5-xml"
